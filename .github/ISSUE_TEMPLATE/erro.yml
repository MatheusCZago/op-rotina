name: Relatar um erro
description: Algo não funcionou como esperado no app
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o que você fez e o que viu na tela.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse?
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e navegador
      placeholder: "Ex.: Android, Chrome"
  - type: markdown
    attributes:
      value: "Não cole dados pessoais, backups ou arquivos de rotina aqui: este repositório é público."
