<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OP% Rotina</title>
<meta name="description" content="OP%: planeje a rotina, registre em dois toques e acompanhe execução, metas, XP e sequência.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ecf1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OP%">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: caderno de bordo mobile-first. Cabeçalho fixo com a data, conteúdo em coluna única,
   barra de abas embaixo (vira coluna lateral em telas largas). O dia é uma linha do tempo com hora em mono. */
:root {
  --bg: #ecf1f0; --surface: #ffffff; --surface-2: #f4f7f7; --ink: #0e2327; --ink-2: #48606a; --ink-3: #6b8186;
  --line: #d9e3e3; --line-2: #c3d1d2;
  --accent: #0a6f73; --accent-hi: #0c8286; --accent-ink: #ffffff; --accent-soft: #d6edec;
  --good: #177a47; --good-soft: #dbf0e3; --warn: #94560a; --warn-soft: #f9ead0; --bad: #ad3a2e; --bad-soft: #f6dcd8;
  --plan: #a9bdc0; --grid: #e3eaea; --axis: #c3d1d2; --tip: #0e2327; --tip-ink: #f4f7f7;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c0: #8aa0a4;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px; --r-s: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1416; --surface: #112124; --surface-2: #162a2e; --ink: #e3eeee; --ink-2: #a3b8bb; --ink-3: #7e969a;
    --line: #203538; --line-2: #2d4649;
    --accent: #3fc1b6; --accent-hi: #5fd3c9; --accent-ink: #06201f; --accent-soft: #12383a;
    --good: #4fc587; --good-soft: #133425; --warn: #e3a34a; --warn-soft: #3a2b12; --bad: #f0877b; --bad-soft: #40201d;
    --plan: #47616a; --grid: #1b3033; --axis: #2d4649; --tip: #e3eeee; --tip-ink: #0a1416;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #5d767b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1416; --surface: #112124; --surface-2: #162a2e; --ink: #e3eeee; --ink-2: #a3b8bb; --ink-3: #7e969a;
  --line: #203538; --line-2: #2d4649;
  --accent: #3fc1b6; --accent-hi: #5fd3c9; --accent-ink: #06201f; --accent-soft: #12383a;
  --good: #4fc587; --good-soft: #133425; --warn: #e3a34a; --warn-soft: #3a2b12; --bad: #f0877b; --bad-soft: #40201d;
  --plan: #47616a; --grid: #1b3033; --axis: #2d4649; --tip: #e3eeee; --tip-ink: #0a1416;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #5d767b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; } .ic.lg { width: 24px; height: 24px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- estrutura ---------- */
.app { max-width: 1160px; margin: 0 auto; display: block; }
.main { min-width: 0; padding-bottom: 24px; }
.top { padding: 16px 0 8px; background: var(--bg); display: grid; gap: 10px; }
.top-1 { display: flex; align-items: flex-start; gap: 10px; }
.top-2 { display: flex; align-items: center; gap: 10px; justify-content: space-between; min-height: 40px; }
.top-2 .sync { margin-left: auto; }
.top h1 { font: 700 24px/1.12 var(--f-display); letter-spacing: -0.01em; flex: 1; min-width: 0; padding-top: 2px; overflow-wrap: anywhere; }
@media (min-width: 900px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; } .top h1 { font-size: 28px; } }
.top h1 small { display: block; font: 500 13px/1.3 var(--f-body); color: var(--ink-2); letter-spacing: 0; margin-top: 3px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink);
}
.icon-btn:hover { border-color: var(--line-2); } .icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding: 0 4px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync.ok i { background: var(--good); } .sync.wait i { background: var(--warn); }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav button {
  border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 7px 2px; border-radius: 12px; color: var(--ink-3); font-size: 11.5px; font-weight: 500;
}
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
@media (min-width: 900px) {
  body { padding-bottom: 40px; }
  .app { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 28px; }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); left: auto; right: auto; bottom: auto; align-self: start; height: auto; margin-top: 18px;
    grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: 18px; padding: 8px; gap: 4px;
  }
}

/* ---------- blocos ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card + .card, .stack > * + * { margin-top: 14px; }
.card.flat { padding: 0; overflow: hidden; }
.sec { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.sec h2 { font: 700 18px/1.2 var(--f-display); letter-spacing: -0.005em; flex: 1; }
.sec .sub { font-size: 12.5px; color: var(--ink-2); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
@media (min-width: 900px) { .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; } .cols > * { min-width: 0; } .cols .stack { margin-top: 0; } }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.hr { height: 1px; background: var(--line); border: 0; margin: 12px 0; }

/* botões e chips */
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hi); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c0); flex: none; display: inline-block; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; min-height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--line-2); }
.seg.full { display: flex; width: 100%; } .seg.full button { flex: 1; padding: 0 6px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-s); background: var(--warn-soft); color: var(--warn); font-size: 13.5px; font-weight: 500; }
.banner.info { background: var(--accent-soft); color: var(--accent); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner .ic { margin-top: 1px; }
.banner button { margin-left: auto; }
.empty { text-align: center; padding: 28px 16px; color: var(--ink-2); }
.empty h3 { font: 700 17px var(--f-display); color: var(--ink); margin-bottom: 4px; }

/* formulários */
label.f { display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 400; color: var(--ink); min-width: 0;
}
textarea { min-height: 76px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); background: var(--surface); }
.form { display: grid; gap: 14px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daypick button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 600; font-size: 13px; color: var(--ink-2); }
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.scale button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scale.n10 { grid-template-columns: repeat(5, 1fr); grid-auto-flow: row; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper b { min-width: 64px; text-align: center; font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; }

/* ---------- HOJE ---------- */
.daynav { display: flex; align-items: center; gap: 8px; }
.daynav .icon-btn { width: 40px; height: 40px; border-radius: 10px; }
.hero { padding: 18px 18px 16px; }
.hero-top { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.pct { font: 700 64px/0.95 var(--f-display); letter-spacing: -0.03em; }
.pct small { font-size: 30px; font-weight: 600; margin-left: 2px; color: var(--ink-2); letter-spacing: 0; }
.pct.dash { color: var(--ink-3); }
.meter { position: relative; height: 10px; border-radius: 999px; background: var(--accent-soft); margin: 16px 0 6px; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.meter > u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: 0.55; }
.meter-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.mini > div { background: var(--surface-2); border-radius: var(--r-s); padding: 10px 12px; min-width: 0; }
.mini b { display: block; font: 700 20px/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.mini span { font-size: 12px; color: var(--ink-2); }
.now-strip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; margin-top: 14px; }
.now-strip .mono { font-weight: 600; }

.tl { list-style: none; margin: 0; padding: 0; }
.tl-i { display: grid; grid-template-columns: 54px 22px minmax(0, 1fr); gap: 0 10px; padding: 14px 14px 14px 14px; position: relative; }
.tl-i + .tl-i { border-top: 1px solid var(--line); }
.tl-t { font: 600 14px/1.2 var(--f-mono); text-align: right; padding-top: 3px; }
.tl-t span { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.tl-n { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
.node { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); display: grid; place-items: center; color: var(--accent-ink); flex: none; }
.node .ic { width: 12px; height: 12px; stroke-width: 3; }
.node.s-ok { background: var(--good); border-color: var(--good); } .node.s-parc { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, var(--surface) 50%); }
.node.s-no { background: var(--bad); border-color: var(--bad); } .node.s-disp { border-style: dashed; border-color: var(--ink-3); background: var(--surface-2); }
.node.fixo { width: 12px; height: 12px; border-radius: 3px; border-color: var(--ink-3); background: var(--line-2); margin: 4px 0 0; }
.tl-b { min-width: 0; }
.tl-name { font-weight: 600; font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.tl-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.tl-meta .cat { display: inline-flex; align-items: center; gap: 6px; }
.tl-i.fixo .tl-name { font-weight: 500; color: var(--ink-2); }
.tl-i.now { background: var(--accent-soft); }
.tl-i.now .tl-t, .tl-i.now .tl-name { color: var(--accent); }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.act { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: grid; justify-items: center; align-content: center; gap: 1px; padding: 3px 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.act .ic { width: 17px; height: 17px; }
.act:hover { border-color: var(--ink-3); }
.act[aria-pressed="true"].a-ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.act[aria-pressed="true"].a-parc { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.act[aria-pressed="true"].a-no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.act[aria-pressed="true"].a-disp { background: var(--surface-2); border-color: var(--ink-3); color: var(--ink); }
.det { margin-top: 10px; display: grid; gap: 10px; padding: 12px; border-radius: var(--r-s); background: var(--surface-2); }
.det .f2 { gap: 10px; }
.xp-got { font: 600 12px var(--f-mono); color: var(--accent); }
.chk-row { display: grid; gap: 8px; }
.chk-row + .chk-row { margin-top: 14px; }
.chk-l { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
.chk-l .hint { margin-left: auto; }

/* ---------- semana ---------- */
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk button { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 2px 9px; display: grid; justify-items: center; gap: 3px; min-height: 76px; }
.wk button.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wk .wd { font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.04em; text-transform: uppercase; }
.wk .dn { font: 700 18px var(--f-display); }
.wk .ex { font: 600 12px var(--f-mono); }
.wk button.fut { background: var(--surface-2); color: var(--ink-3); }
.wk button.h1 { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); } .wk button.h2 { background: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
.wk button.h3 { background: color-mix(in srgb, var(--accent) 38%, var(--surface)); } .wk button.h0 { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.bar { height: 8px; border-radius: 999px; background: var(--accent-soft); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; }
.bar.over > i { background: var(--good); }
.goal { display: grid; gap: 6px; } .goal + .goal { margin-top: 14px; }
.goal-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.goal-h .v { margin-left: auto; font: 500 12.5px var(--f-mono); color: var(--ink-2); }
.dayblock + .dayblock { border-top: 1px solid var(--line); }
.dayblock summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; font-weight: 600; }
.dayblock summary::-webkit-details-marker { display: none; }
.dayblock summary .chev { margin-left: auto; transition: transform .15s; } .dayblock[open] summary .chev { transform: rotate(180deg); }
.mini-l { padding: 0 14px 10px 14px; display: grid; gap: 2px; }
.mini-l button { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 7px 0; min-height: 36px; border-radius: 8px; }
.mini-l .t { font: 500 12.5px var(--f-mono); color: var(--ink-2); }
.mini-l .n { overflow-wrap: anywhere; font-size: 14px; }
.mini-l .fx { color: var(--ink-3); }

/* ---------- painel ---------- */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

<body>
<div id="app" aria-live="polite"></div>
<noscript>O OP% precisa de JavaScript para funcionar.</noscript>
<script>
/* ===== OP% · motor de cálculo (porta fiel das regras do Excel V1.0) ===== */
(function (root) {
'use strict';
var DAY = 86400000;
var pad = function (n) { return String(n).padStart(2, '0'); };
var toN = function (iso) { var p = String(iso).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY); };
var toISO = function (n) { var d = new Date(n * DAY); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
var wdOf = function (n) { return (((n % 7) + 7 + 3) % 7); };           // 0 = segunda
var mondayOf = function (n) { return n - wdOf(n); };
var monthStart = function (n) { var d = new Date(n * DAY); return Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / DAY); };
var addMonths = function (n, k) { var d = new Date(n * DAY); return Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1) / DAY); };
var hm = function (s) { var p = String(s || '0:0').split(':'); return (+p[0]) * 60 + (+p[1] || 0); };
var fmtHM = function (m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
var durMin = function (a, b) { return (((hm(b) - hm(a)) % 1440) + 1440) % 1440; };
var r0 = function (v) { return Math.round(+(+v).toPrecision(12)); };
var sum = function (a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; };
var avg = function (a) { return a.length ? sum(a) / a.length : null; };
var num = function (v) { return typeof v === 'number' && isFinite(v); };
var EPS = 1e-9;

var PERIODOS = [
  { id: 'semana', nome: 'Semana atual' }, { id: '7', nome: 'Últimos 7 dias' }, { id: '30', nome: 'Últimos 30 dias' },
  { id: '90', nome: 'Últimos 90 dias' }, { id: 'mes', nome: 'Mês atual' }, { id: 'tudo', nome: 'Tudo' }
];
var DIAS_ABREV = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
var DIAS_NOME = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];

function build(S, refISO) {
  var cfg = S.cfg, ref = toN(refISO), ini = toN(cfg.inicio);
  var stMap = {}; cfg.status.forEach(function (s) { stMap[s.nome] = s; });
  var priXp = {}; cfg.pri.forEach(function (p) { priXp[p.nome] = p.xp; });
  var notas = cfg.notas.slice().sort(function (a, b) { return a.min - b.min; });
  var niveis = cfg.niveis.slice().sort(function (a, b) { return a.xp - b.xp; });
  var multNota = function (n) { if (n == null || n === '') return 1; var m = null; for (var i = 0; i < notas.length; i++) if (notas[i].min <= n) m = notas[i].mult; return m == null ? 1 : m; };

  // ---- ROTINA ----------------------------------------------------------------
  var rot = [], byName = {};
  S.rot.forEach(function (r, i) {
    if (!r.nome) return;
    var o = Object.assign({}, r, {
      idx: i, dur: durMin(r.ini, r.fim), xp: r.pri ? (priXp[r.pri] || 0) : 0,
      deN: r.de ? toN(r.de) : -Infinity, ateN: r.ate ? toN(r.ate) : Infinity,
      ordKey: ((hm(r.ini) - hm(cfg.inicioDia)) % 1440 + 1440) % 1440
    });
    rot.push(o); (byName[o.nome] || (byName[o.nome] = [])).push(o);
  });
  var vigente = function (rows, n) { var f = null; rows.forEach(function (r) { if (r.deN <= n && n <= r.ateN) f = r; }); return f; };
  var planned = function (n) {                                   // linhas da ROTINA vigentes no dia (inclui fixos)
    var wd = wdOf(n);
    return rot.filter(function (r) { return r.deN <= n && n <= r.ateN && r.dias[wd] === 1; });
  };

  // ---- REGISTROS achatados -----------------------------------------------------
  var regs = [], byDate = {};
  Object.keys(S.reg).forEach(function (iso) {
    var n = toN(iso); if (n < ini) return;
    var day = S.reg[iso];
    Object.keys(day).forEach(function (nome) {
      var e = day[nome], rows = byName[nome], row = null, refOk = false, alerta = 'OK';
      if (!rows) alerta = 'Atividade não existe na ROTINA';
      else if (rows.some(function (r) { return r.fixo; })) alerta = 'Atividade fixa — não precisa registrar';
      else { refOk = true; row = vigente(rows, n); if (!row) { row = rows[0]; alerta = 'Atividade fora da vigência nesta data'; } }
      if (alerta === 'OK') {
        if (n > ref) alerta = 'Data futura';
        else if (e.n != null && (e.n < 1 || e.n > 10)) alerta = 'Nota fora de 1-10';
        else if (e.m != null && e.m < 0) alerta = 'Minutos negativos';
      }
      var st = stMap[e.s], cred = (refOk && st && st.conta) ? st.credito : null;
      var plan = refOk ? row.dur : 0;
      var o = {
        iso: iso, n: n, nome: nome, s: e.s, m: e.m == null ? null : e.m, nota: e.n == null ? null : e.n, obs: e.o || '',
        refOk: refOk, row: row, cat: refOk ? row.cat : '?', plan: plan, cred: cred, alerta: alerta,
        min: cred != null ? (e.m != null ? e.m : plan * cred) : null,
        xp: cred != null ? r0(row.xp * cred * multNota(e.n)) : null,
        sem: mondayOf(n), mes: monthStart(n)
      };
      regs.push(o); (byDate[n] || (byDate[n] = [])).push(o);
    });
  });

  // ---- CHECK-IN ------------------------------------------------------------------
  var chkBy = {};
  Object.keys(S.chk).forEach(function (iso) { chkBy[toN(iso)] = S.chk[iso]; });

  // ---- BASE (um dia por linha) ---------------------------------------------------
  function dayStats(n) {
    var folga = !!(S.folgas && S.folgas[toISO(n)]);
    var F = folga ? 0 : planned(n).filter(function (r) { return !r.fixo; }).length;
    var rs = byDate[n] || [], valid = rs.filter(function (r) { return r.refOk; });
    var G = valid.length, withC = valid.filter(function (r) { return r.cred != null; }), H = withC.length;
    var I = sum(withC.map(function (r) { return r.cred; }));
    var den = Math.max(F - (G - H), H);
    var exec = (G === 0 || den <= 0) ? null : Math.min(1, I / den);
    var cons = F === 0 ? null : Math.min(1, G / F);
    var bom = exec == null ? null : (exec >= cfg.metaDia - EPS ? 1 : 0);
    var bonus = bom === 1 ? cfg.bonus : 0, xpat = sum(withC.map(function (r) { return r.xp; }));
    var nts = rs.filter(function (r) { return r.nota != null; }).map(function (r) { return r.nota; });
    var c = chkBy[n] || {};
    return {
      n: n, iso: toISO(n), wd: wdOf(n), sem: mondayOf(n), mes: monthStart(n), folga: folga, F: F, G: G, H: H, pts: I, exec: exec, cons: cons,
      minplan: sum(withC.map(function (r) { return r.plan; })), minreal: sum(withC.map(function (r) { return r.min; })),
      xpat: xpat, bom: bom, bonus: bonus, xp: xpat + bonus, nota: avg(nts), seq: null,
      sono: num(c.sono) ? c.sono : null, ene: num(c.ene) ? c.ene : null, hum: num(c.hum) ? c.hum : null
    };
  }
  var days = [], dayMap = {}, seq = 0;
  for (var n = ini; n <= ref; n++) {
    var d = dayStats(n);
    if (d.bom === 1) seq += 1; else if (n === ref) { /* hoje aberto não quebra */ } else if (d.bom === 0 || (d.F > 0 && d.G === 0)) seq = 0;
    d.seq = seq; days.push(d); dayMap[n] = d;
  }

  // ---- período -------------------------------------------------------------------
  function periodStart(id) {
    switch (id) {
      case 'semana': return mondayOf(ref);
      case '7': return ref - 6;
      case '30': return ref - 29;
      case '90': return ref - 89;
      case 'mes': return monthStart(ref);
      default: return ini;
    }
  }
  var nivelDe = function (xp) { var lv = 1; niveis.forEach(function (x, i) { if (xp >= x.xp) lv = i + 1; }); return lv; };

  function kpis(deN) {
    var D = days.filter(function (d) { return d.n >= deN; });
    var R = regs.filter(function (r) { return r.n >= deN && r.n <= ref; });
    var k = {};
    k.de = deN; k.ate = ref; k.perDias = Math.max(0, ref - Math.max(deN, ini) + 1);
    k.dias = D.filter(function (d) { return d.G > 0; }).length;
    k.exec = avg(D.filter(function (d) { return d.exec != null; }).map(function (d) { return d.exec; }));
    k.cons = avg(D.filter(function (d) { return d.cons != null; }).map(function (d) { return d.cons; }));
    k.hplan = sum(D.map(function (d) { return d.minplan; })) / 60;
    k.hreal = sum(D.map(function (d) { return d.minreal; })) / 60;
    k.adh = k.hplan === 0 ? null : k.hreal / k.hplan;
    k.nota = avg(R.filter(function (r) { return r.nota != null; }).map(function (r) { return r.nota; }));
    k.bons = sum(D.map(function (d) { return d.bom === 1 ? 1 : 0; }));
    k.seq = days.length ? days[days.length - 1].seq : 0;
    k.seqmax = days.reduce(function (m, d) { return Math.max(m, d.seq || 0); }, 0);
    k.xp = sum(D.map(function (d) { return d.xp; }));
    k.xptot = sum(days.map(function (d) { return d.xp; }));
    k.nivel = nivelDe(k.xptot);
    k.titulo = niveis[k.nivel - 1].nome;
    k.maxNivel = k.nivel >= niveis.length;
    k.xpprox = k.maxNivel ? 0 : niveis[k.nivel].xp - k.xptot;
    k.prog = k.maxNivel ? 1 : (k.xptot - niveis[k.nivel - 1].xp) / (niveis[k.nivel].xp - niveis[k.nivel - 1].xp);
    var col = function (key, filt) { return avg(D.filter(function (d) { return d[key] != null && (!filt || filt(d)); }).map(function (d) { return d[key]; })); };
    k.sono = col('sono'); k.ene = col('ene'); k.hum = col('hum');
    k.execSonoOk = avg(D.filter(function (d) { return d.exec != null && d.sono != null && d.sono >= cfg.metaSono; }).map(function (d) { return d.exec; }));
    k.execSonoBaixo = avg(D.filter(function (d) { return d.exec != null && d.sono != null && d.sono < cfg.metaSono; }).map(function (d) { return d.exec; }));
    k.alertas = regs.filter(function (r) { return r.alerta !== 'OK'; }).length;
    return k;
  }

  function porCategoria(deN) {
    var R = regs.filter(function (r) { return r.n >= deN && r.n <= ref; });
    var perDias = Math.max(0, ref - Math.max(deN, ini) + 1);
    return cfg.cats.map(function (c) {
      var X = R.filter(function (r) { return r.cat === c.nome && r.cred != null; });
      var hplan = sum(X.map(function (r) { return r.plan; })) / 60, hreal = sum(X.map(function (r) { return r.min; })) / 60;
      var hsem = perDias ? hreal / (perDias / 7) : null;
      var meta = (c.meta == null || c.meta === '') ? null : +c.meta;
      return {
        nome: c.nome, meta: meta, registros: X.length, exec: avg(X.map(function (r) { return r.cred; })),
        hplan: hplan, hreal: hreal, adh: hplan > 0 ? hreal / hplan : null,
        nota: avg(X.filter(function (r) { return r.nota != null; }).map(function (r) { return r.nota; })),
        xp: sum(X.map(function (r) { return r.xp; })), hsem: hsem,
        pct: (meta != null && meta > 0 && hsem != null) ? hsem / meta : null
      };
    });
  }

  function porAtividade(deN) {
    var seen = {}, out = [];
    rot.forEach(function (r) {
      if (seen[r.nome]) return; seen[r.nome] = 1;
      var all = regs.filter(function (x) { return x.nome === r.nome; });
      var X = all.filter(function (x) { return x.n >= deN && x.n <= ref && x.cred != null; });
      var ult = all.length ? all.reduce(function (m, x) { return Math.max(m, x.n); }, -Infinity) : null;
      out.push({
        nome: r.nome, cat: r.cat, fixo: !!r.fixo, registros: X.length, concluidos: X.filter(function (x) { return x.cred >= 1; }).length,
        exec: avg(X.map(function (x) { return x.cred; })),
        nota: avg(X.filter(function (x) { return x.nota != null; }).map(function (x) { return x.nota; })),
        hreal: sum(X.map(function (x) { return x.min; })) / 60, xp: sum(X.map(function (x) { return x.xp; })),
        ultima: ult, diasSem: ult == null ? null : ref - ult, idx: out.length
      });
    });
    return out;
  }
  function atencao(acts) {
    return acts.filter(function (a) { return !a.fixo && a.registros >= cfg.minRank && a.exec != null; })
      .sort(function (a, b) { return a.exec - b.exec || a.idx - b.idx; }).slice(0, 3);
  }

  function porDiaSemana(deN) {
    var D = days.filter(function (d) { return d.n >= deN; });
    return [0, 1, 2, 3, 4, 5, 6].map(function (w) {
      var X = D.filter(function (d) { return d.wd === w; });
      return {
        wd: w, nome: DIAS_NOME[w], abrev: DIAS_ABREV[w], dias: X.filter(function (d) { return d.G > 0; }).length,
        exec: avg(X.filter(function (d) { return d.exec != null; }).map(function (d) { return d.exec; })),
        xp: avg(X.filter(function (d) { return d.G > 0; }).map(function (d) { return d.xp; }))
      };
    });
  }

  function serieDias(k) {
    var out = [];
    for (var i = 0; i < k; i++) {
      var n = ref - (k - 1) + i, d = dayMap[n];
      out.push({ n: n, iso: toISO(n), exec: d ? d.exec : null, cons: d ? d.cons : null, xp: d ? d.xp : 0, bom: d ? d.bom : null, F: d ? d.F : 0, G: d ? d.G : 0, antes: n < ini });
    }
    return out;
  }
  function weekAgg(w) {
    var D = days.filter(function (d) { return d.sem === w; });
    var R = regs.filter(function (r) { return r.sem === w && r.n <= ref; });

/* ---- ações ---- */
function curDia(M) { return M.dia(App.date || M.refISO); }
function setStatus(iso, nome, s) {
  var M0 = App.M, k0 = M0.kpis(M0.ref).xptot;
  Store.mutate(function (S) {
    var day = S.reg[iso] || (S.reg[iso] = {}), e = day[nome];
    if (e && e.s === s) { delete day[nome]; if (!Object.keys(day).length) delete S.reg[iso]; return; }
    e = e || {}; e.s = s; if (s === 'Dispensado' || s === 'Não feito') { delete e.m; delete e.n; } day[nome] = e;
  }, [Store.dateShard(iso)]);
  var M1 = App.M, k1 = M1.kpis(M1.ref);
  if (k1.nivel > M0.kpis(M0.ref).nivel) Toast('Nível ' + k1.nivel + ': ' + k1.titulo + '. Continue assim!');
  else if (s === 'Concluído' || s === 'Parcial') { var rg = M1.regs.filter(function (r) { return r.iso === iso && r.nome === nome; })[0]; if (rg && rg.xp != null) Toast(s + ' · +' + rg.xp + ' XP'); }
}

/* ---- dispensar dias / folgas ---- */
function folgaRanges(S) {
  var ds = Object.keys(S.folgas || {}).sort(), out = [];
  ds.forEach(function (d) {
    var last = out[out.length - 1];
    if (last && OPX.toN(d) === OPX.toN(last.fim) + 1 && S.folgas[d] === last.motivo) last.fim = d; else out.push({ ini: d, fim: d, motivo: S.folgas[d] });
  });
  return out;
}

      else if (k === 'disp') Store.mutate(function (S2) { var day = S2.reg[iso] || (S2.reg[iso] = {}); D.list.forEach(function (x) { if (!x.fixo && !x.entry) day[x.row.nome] = { s: 'Dispensado' }; }); }, [Store.dateShard(iso)]);

/* ===== OP% · tela SEMANA (visão da semana + revisão semanal) ===== */
var MARK = { 'Concluído': '✓', 'Parcial': '½', 'Não feito': '✕', 'Dispensado': '–', 'Pendente': '' };

VIEWS.semana = function (M) {
  var S = Store.get(), cfg = S.cfg, w = App.week ? OPX.toN(App.week) : OPX.mondayOf(M.ref), wISO = OPX.toISO(w);
  App.week = wISO;

  var html = '', cells = '', blocks = '';

    var cls = n === M.ref ? 'today ' : '', txt = '·';
    if (D.folga) { txt = 'folga'; cls += 'fut'; }
    else if (n > M.ref || n < M.ini) { cls += 'fut'; txt = n > M.ref ? '' : '—'; }
    else if (ex != null) { txt = Math.round(ex * 100) + '%'; cls += ex >= cfg.metaDia - 1e-9 ? 'h3' : ex >= 0.6 ? 'h2' : ex > 0 ? 'h1' : 'h0'; }
    else if (st.F > 0) { if (n < M.ref) { txt = '0%'; cls += 'h0'; } else txt = '—'; }
    cells += '<button type="button" class="' + cls + '" data-a="irdia" data-d="' + iso + '"><span class="wd">' + OPX.DIAS_ABREV[i] + '</span><span class="dn">' + iso.slice(8) + '</span><span class="ex">' + txt + '</span></button>';

    '<div class="kpi"><div class="l">XP da semana</div><div class="v">' + F.int(A.xp) + '</div><div class="s">sono médio ' + (A.sono == null ? '—' : F.dec(A.sono, 1) + ' h') + '</div></div></div>';

      '', { head: ['Semana', 'Execução', 'Registro', 'Dias bons'], rows: sw.slice().reverse().map(function (w) { return [F.dm(w.iso), F.pct(w.exec), F.pct(w.cons), w.bons]; }) });

    // 6) horas por semana

      { kind: 'line', valFmt: function (v) { return F.dec(v, 1) + ' h'; }, tickFmt: function (v) { return F.dec(v, 0); }, data: sw.map(function (w) { return { x: F.dm(w.iso), v: w.horas, tip: 'Semana de ' + F.dm(w.iso) + '|' + F.dec(w.horas, 1) + ' h realizadas' }; }) },

    // 7) sono x execução

function rowSit(r, ref) { return (r.de && OPX.toN(r.de) > ref) ? 'futura' : (r.ate && OPX.toN(r.ate) < ref) ? 'encerrada' : 'vigor'; }

VIEWS.rotina = function (M) {
  var S = Store.get(), cfg = S.cfg, v = App.rotView, html = '', fab = '';
  var wd = App.rotWd == null ? OPX.wdOf(M.ref) : App.rotWd;
  html += '<div class="seg full" style="margin-bottom:14px" role="tablist">' + [['dia', 'Por dia'], ['lista', 'Atividades'], ['cats', 'Categorias']].map(function (t) {
    return '<button type="button" data-a="rotv" data-v="' + t[0] + '" aria-selected="' + (v === t[0]) + '">' + t[1] + '</button>';
  }).join('') + '</div>';

  var vig = M.rot.filter(function (r) { return rowSit(r, M.ref) === 'vigor'; });
  var reg = 0, fix = 0; vig.forEach(function (r) { var h = r.dur * r.dias.reduce(function (a, b) { return a + b; }, 0) / 60; if (r.fixo) fix += h; else reg += h; });

function saveRot(id, f, catNova, modo, from) {

    var r = S.rot.filter(function (x) { return x.id === id; })[0];
    if (r.nome !== f.nome) {
      var old = r.nome; S.rot.forEach(function (x) { if (x.nome === old) x.nome = f.nome; });
      Object.keys(S.reg).forEach(function (d) { var day = S.reg[d]; if (day[old] && !day[f.nome]) { day[f.nome] = day[old]; delete day[old]; ids.push(Store.dateShard(d)); } });
    }
    var chg = r.cat !== f.cat || r.ini !== f.ini || r.fim !== f.fim || r.pri !== f.pri || r.fixo !== f.fixo || r.dias.join() !== f.dias.join();
    if (chg && modo === 'desde' && OPX.toN(from) > OPX.toN(r.de) && !(r.ate && OPX.toN(from) > OPX.toN(r.ate))) {
      var oldAte = r.ate; r.ate = OPX.toISO(OPX.toN(from) - 1);
      S.rot.push({ id: OPD.newId(), nome: f.nome, cat: f.cat, ini: f.ini, fim: f.fim, pri: f.pri, dias: f.dias, de: from, ate: f.ate || oldAte || '', fixo: f.fixo });
    } else { r.cat = f.cat; r.ini = f.ini; r.fim = f.fim; r.pri = f.pri; r.dias = f.dias; r.fixo = f.fixo; r.ate = f.ate; }
  }, ids);
}
function delRot(r) {
  var S = Store.get(), n = regCount(S, r.nome), today = Store.todayISO();
  if (n > 0) {
    Sheet.confirm({ title: 'Não dá para excluir', text: '“' + esc(r.nome) + '” tem ' + n + ' registro' + (n > 1 ? 's' : '') + ' no histórico. Encerre a atividade para ela sair do plano e manter o histórico.', ok: 'Encerrar atividade', no: 'Voltar' }).then(function (ok) {

  }

    if (!ok) return; Store.checkpoint(); Store.mutate(function (S2) { S2.rot = S2.rot.filter(function (x) { return x.id !== r.id; }); }, ['cfg']);

  });
}

    '<li><b>Tempo contabilizado:</b> o “tempo realizado” que você informou; sem ele, o planejado × crédito.</li></ul>' +
    '<h3>Mudar a rotina sem perder o histórico</h3><p>Ao editar o horário ou os dias de uma atividade com histórico, escolha “a partir de uma data”. O app encerra a versão antiga e cria uma nova. Os dias passados continuam calculados com o horário que valia na época.</p>' +
    '<h3>Folgas e viagens</h3><p>No menu ⋯ da tela Hoje, marque os dias em que a rotina não se aplica. Eles não pesam na execução nem quebram a sequência.</p>' +
    '<h3>Backup</h3><p>' + (STANDALONE ? 'Seus dados ficam só neste aparelho, no navegador. Se você limpar os dados do navegador ou trocar de celular, eles somem: salve um backup de vez em quando.' : 'Seus dados ficam na sua conta e neste aparelho. Mesmo assim, salve um backup de vez em quando.') + ' A planilha exportada tem as mesmas colunas do Excel do OP% e uma aba BASE (um dia por linha) pronta para Power BI ou Python.</p></div>';
}

VIEWS.ajustes = null;
function instalarHTML() {
  if (App.instalado || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) return '<p class="muted">O OP% já está instalado neste aparelho.</p>';
  return (App.installEv ? '<button class="btn primary block" type="button" data-a="instalar">' + ic('download', 'sm') + ' Instalar o OP% neste aparelho</button><p class="hint" style="margin-top:10px">Cria um ícone na tela inicial; abre em tela cheia e funciona sem internet.</p>'
    : '<p class="muted">No <b>Chrome (Android)</b>: toque em ⋮ e depois em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</p><p class="muted" style="margin-top:8px">No <b>iPhone (Safari)</b>: toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</p><p class="hint" style="margin-top:8px">Depois de instalado, funciona sem internet e abre em tela cheia.</p>');
}
ACT.instalar = async function () {
  var e = App.installEv; if (!e) return;
  try { await e.prompt(); var r = await e.userChoice; if (r && r.outcome === 'accepted') { App.installEv = null; App.instalado = true; } } catch (x) { /* ok */ }
  render(true);
};
function viewAjustes(M) {
  var S = Store.get(), c = S.cfg, ss = Store.syncState(), html = '<div class="stack">';
  var dados = '<p class="muted" style="margin-bottom:12px">' + (ss === 'local' ? 'Seus dados estão salvos só neste navegador. Faça backup com frequência.' : ss === 'erro' ? 'Sem conexão agora. Suas alterações ficam salvas neste aparelho e sobem quando voltar.' : ss === 'cheio' ? 'O armazenamento da conta está cheio. Exporte um backup e apague registros antigos.' : 'Seus dados estão salvos na sua conta e aparecem em qualquer aparelho em que você abrir este app.') + '</p>' +
    '<div class="grid g-auto"><button class="btn" type="button" data-a="bkjson">' + ic('download', 'sm') + ' Backup (.json)</button><button class="btn" type="button" data-a="bkxlsx">' + ic('download', 'sm') + ' Planilha (.xlsx)</button>' +
    '<button class="btn" type="button" data-a="bkcopy">' + ic('copy', 'sm') + ' Copiar backup</button><button class="btn" type="button" data-a="importar">' + ic('upload', 'sm') + ' Importar arquivo</button>' +
    '<button class="btn" type="button" data-a="colar">' + ic('upload', 'sm') + ' Colar backup</button></div>' +
    '<p class="hint" style="margin-top:10px">Importa o OP_Sistema.xlsx (Excel) ou um backup .json. Você escolhe entre mesclar e substituir.</p><hr class="hr"><button class="btn danger sm" type="button" data-a="apagar">Apagar todos os dados</button>';
  var lb = lsGet('opx:lastbk');
  dados = '<p class="hint" style="margin-bottom:10px">Último backup: <b>' + (lb ? F.dmy(lb) : 'nunca') + '</b></p>' + dados;
  html += acc('Dados e backup', dados, true);
  if (STANDALONE) html += acc('Instalar no celular', instalarHTML(), false);
  var pr = kv('Início do sistema', 'dias antes dele são ignorados', inp('inicio', 'date', c.inicio)) +
    kv('Meta de execução diária', 'define o dia bom (%)', inp('metaDia', 'pct', Math.round(c.metaDia * 100), 'min="10" max="100" step="5" inputmode="numeric"')) +
    kv('Bônus de XP por dia bom', '', inp('bonus', 'num', c.bonus, 'min="0" step="5" inputmode="numeric"')) +
    kv('Início do dia', 'atividades antes dessa hora vão para o fim do dia', inp('inicioDia', 'time', c.inicioDia)) +
    kv('Meta de sono (h)', 'compara execução com sono bom e ruim', inp('metaSono', 'num', c.metaSono, 'min="3" max="12" step="0.5" inputmode="decimal"')) +
    kv('Nota-alvo (1 a 10)', 'referência de qualidade', inp('notaAlvo', 'num', c.notaAlvo, 'min="1" max="10" step="0.5" inputmode="decimal"')) +
    kv('Mínimo de registros no ranking', 'para entrar em “precisa de atenção”', inp('minRank', 'num', c.minRank, 'min="1" max="30" step="1" inputmode="numeric"'));
  html += acc('Parâmetros gerais', pr, false);
  var parc = c.status.map(function (s, i) { return s.nome === 'Parcial' ? i : -1; }).filter(function (i) { return i >= 0; })[0];
  var xp = c.pri.map(function (p, i) { return kv('XP base · prioridade ' + esc(p.nome), '', inp('pri.' + i + '.xp', 'num', p.xp, 'min="0" step="5" inputmode="numeric"')); }).join('') +
    (parc != null ? kv('Crédito de “Parcial”', '0 a 1 (0,5 = metade)', inp('status.' + parc + '.credito', 'num', c.status[parc].credito, 'min="0" max="1" step="0.1" inputmode="decimal"')) : '') +
    c.notas.map(function (n, i) { return kv('Multiplicador · nota a partir de ' + n.min + (n.faixa ? ' (' + esc(n.faixa) + ')' : ''), '', inp('notas.' + i + '.mult', 'num', n.mult, 'min="0.5" max="2" step="0.05" inputmode="decimal"')); }).join('') +
    '<div class="eyebrow" style="margin:14px 0 4px">Níveis (XP mínimo)</div>' + c.niveis.map(function (n, i) { return kv('Nível ' + (i + 1) + ' · ' + esc(n.nome), '', inp('niveis.' + i + '.xp', 'num', n.xp, 'min="0" step="100" inputmode="numeric"' + (i === 0 ? ' disabled' : ''))); }).join('');
  html += acc('XP e níveis', xp, false);
  html += acc('Como o OP% funciona', guideHTML(), false);
  html += acc('Sobre', '<p class="muted">OP% · Sistema de Desenvolvimento Pessoal, versão aplicativo 1.0. Usa as mesmas regras do Excel V1.0.</p><p class="hint" style="margin-top:8px">Próximos passos possíveis: lembretes, metas por OKR, comparação entre meses e exportação direta para Power BI.</p>', false);
  return { title: 'Ajustes', sub: 'parâmetros, backup e guia', back: true, html: html + '</div>' };
}
function setPath(o, path, v) { var p = path.split('.'); for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = v; }
CHG.cfg = function (el) {
  var path = el.getAttribute('data-k'), t = el.getAttribute('data-t'), raw = el.value, v;
  if (t === 'date' || t === 'time') { if (!raw) { render(true); return; } v = raw; }
  else { if (raw === '' || !isFinite(+raw)) { render(true); return; } v = +raw; if (t === 'pct') v = Math.max(0.1, Math.min(1, v / 100)); }
  if (el.min !== '' && t !== 'pct' && t !== 'date' && t !== 'time') v = Math.max(+el.min, v);
  if (el.max !== '' && t !== 'pct' && t !== 'date' && t !== 'time') v = Math.min(+el.max, v);
  Store.mutate(function (S) { setPath(S.cfg, path, v); if (path.indexOf('niveis') === 0) S.cfg.niveis.sort(function (a, b) { return a.xp - b.xp; }); }, ['cfg']);
  if (path === 'inicio') Toast('Registros anteriores a ' + F.dmy(v) + ' passam a ser ignorados.');
};

/* ---- backup e importação ---- */
function backupText() { return JSON.stringify({ app: 'OP%', versao: 1, exportadoEm: new Date().toISOString(), state: Store.get() }); }
ACT.bkjson = function () { IO.saveFile('OP_backup_' + Store.todayISO() + '.json', backupText()).then(function (ok) { if (ok) render(true); }); };
ACT.bkxlsx = async function () {
  try { Toast('Preparando a planilha…'); var X = await IO.loadXLSX(), wb = IO.buildWorkbook(X, Store.get(), App.M), buf = X.write(wb, { bookType: 'xlsx', type: 'array' }); await IO.saveFile('OP_dados_' + Store.todayISO() + '.xlsx', buf); }
  catch (e) { Toast(e && e.message ? e.message : 'Não foi possível gerar a planilha.'); }
};
ACT.bkcopy = function () {
  var txt = backupText();
  var fallback = function () {
    var s = Sheet.open({ title: 'Backup em texto', sub: 'Selecione tudo, copie e guarde em um lugar seguro. Para restaurar, use “Colar backup”.', body: '<textarea id="bk-t" readonly style="min-height:200px;font-family:var(--f-mono);font-size:12px">' + esc(txt) + '</textarea>', foot: '<button class="btn primary" type="button" data-k="x">Fechar</button>' });
    var t = $('#bk-t', s); t.focus(); t.select(); $('[data-k="x"]', s).onclick = function () { Sheet.close(); };
  };
  try { navigator.clipboard.writeText(txt).then(function () { Toast('Backup copiado'); }, fallback); } catch (e) { fallback(); }
};
ACT.colar = function () {
  var s = Sheet.open({ title: 'Colar backup', sub: 'Cole aqui o texto do backup copiado antes.', body: '<textarea id="bk-t" style="min-height:180px;font-family:var(--f-mono);font-size:12px" placeholder="{ &quot;app&quot;: &quot;OP%&quot;, ..."></textarea>', foot: '<button class="btn" type="button" data-k="x">Cancelar</button><button class="btn primary" type="button" data-k="ok">Continuar</button>' });
  $('[data-k="x"]', s).onclick = function () { Sheet.close(); };
  $('[data-k="ok"]', s).onclick = function () { try { var p = IO.parseJSON($('#bk-t', s).value); Sheet.close(); importDialog(p, 'texto colado'); } catch (e) { Toast('Não reconheci este texto como um backup do OP%.'); } };
};
ACT.importar = function () {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xlsm,.json,application/json';
  inp.onchange = function () { if (inp.files[0]) readFile(inp.files[0]); }; inp.click();
};
async function readFile(f) {
  try {
    var p;
    if (/\.json$/i.test(f.name)) p = IO.parseJSON(await f.text());
    else { Toast('Lendo a planilha…'); var X = await IO.loadXLSX(); p = await IO.parseWorkbook(X, await f.arrayBuffer()); }
    importDialog(p, f.name);
  } catch (e) { Toast(e && e.message ? e.message : 'Não consegui ler este arquivo.'); }
}
function importDialog(p, nome) {
  var has = Store.has(), i = p.info, mode = has ? 'mesclar' : 'substituir';
  var s = Sheet.open({
    title: 'Importar dados', sub: 'Arquivo: ' + esc(nome),
    body: '<div class="card flat"><div class="item"><span class="n">Registros de atividades</span><b>' + i.regs + '</b></div><div class="item"><span class="n">Atividades na rotina</span><b>' + i.rot + '</b></div><div class="item"><span class="n">Check-ins</span><b>' + i.chk + '</b></div><div class="item"><span class="n">Metas · revisões</span><b>' + i.metas + ' · ' + i.rev + '</b></div></div>' +
      (has ? '<div class="seg full" id="im-m" style="margin-top:14px"><button type="button" data-m="mesclar" aria-pressed="true">Mesclar</button><button type="button" data-m="substituir" aria-pressed="false">Substituir tudo</button></div><p class="hint" id="im-h" style="margin-top:8px"></p>' : ''),
    foot: '<button class="btn" type="button" data-k="x">Cancelar</button><button class="btn primary" type="button" data-k="ok">Importar</button>'
  });
  var hint = function () { var h = $('#im-h', s); if (!h) return; h.textContent = mode === 'mesclar' ? 'Soma o que veio do arquivo ao que você já tem. Em caso de conflito no mesmo dia e atividade, vale o arquivo.' : 'Apaga o que existe hoje no app e usa só o conteúdo do arquivo.'; $$('#im-m button', s).forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-m') === mode)); }); };
  if (has) { $('#im-m', s).onclick = function (e) { var b = e.target.closest('button'); if (b) { mode = b.getAttribute('data-m'); hint(); } }; hint(); }
  $('[data-k="x"]', s).onclick = function () { Sheet.close(); };
  $('[data-k="ok"]', s).onclick = async function () {
    Sheet.close();
    if (has && mode === 'mesclar') await Store.replaceAll(IO.merge(Store.get(), p.state)); else if (has) await Store.replaceAll(p.state); else Store.start(p.state);
    App.tab = 'hoje'; App.page = null; App.date = null; render(false); Toast('Dados importados');
  };
}
ACT.apagar = function () {
  Sheet.confirm({ title: 'Apagar todos os dados?', text: 'Isso remove rotina, registros, check-ins, metas e revisões ' + (STANDALONE ? 'deste aparelho' : 'da sua conta e deste aparelho') + '. Faça um backup antes. Não dá para desfazer.', ok: 'Apagar tudo', danger: true }).then(async function (ok) {
    if (!ok) return; await Store.wipe(); App.page = null; App.date = null; App.week = null; render(false);
  });
};

/* ---- boas-vindas ---- */
function welcomeHTML() {
  return '<div class="welcome"><h1>OP%</h1><p>Planeje a rotina, registre o que aconteceu em dois toques e acompanhe sua execução, metas, XP e sequência. É o mesmo sistema do Excel, agora no celular.</p>' +
    (STANDALONE ? '<button class="opt" type="button" data-a="comecar" data-m="modelo"><b>Ver com uma rotina de exemplo</b><span>Trabalho, faculdade e estudos já cadastrados, com metas, só para você ver o app funcionando. Você edita tudo depois.</span></button>'
      : '<button class="opt" type="button" data-a="comecar" data-m="modelo"><b>Usar meu modelo de estudos</b><span>Trabalho, faculdade, inglês, SQL, Excel e carreira já cadastrados, com metas. Você edita tudo depois.</span></button>') +
    '<button class="opt" type="button" data-a="comecar" data-m="branco"><b>Começar do zero</b><span>Você cadastra as suas atividades na aba Rotina.</span></button>' +
    '<button class="opt" type="button" data-a="importar"><b>Importar meus dados</b><span>Traga o OP_Sistema.xlsx ou um backup do app (.json).</span></button>' +
    '<p class="hint" style="margin-top:18px">' + (STANDALONE ? 'Seus dados ficam guardados só neste aparelho, no navegador. Em Ajustes você faz backup (e leva para outro aparelho) quando quiser.' : 'Seus dados ficam guardados na sua conta e neste aparelho. Em Ajustes você faz backup quando quiser.') + '</p></div>';
}
ACT.comecar = function (el) { Store.start(OPD.novoEstado(el.getAttribute('data-m'), Store.todayISO())); App.tab = 'hoje'; render(false); };

async function boot() {
  Store.initLocal();
  var saved = lsGet('opx:tab'); if (saved && VIEWS[saved]) App.tab = saved;
  var hadLocal = Store.has();
  App.ready = hadLocal; render(false);
  var ok = await Store.connect();
  App.ready = true; lastW = window.innerWidth;
  render(hadLocal);
  if (STANDALONE && Store.has() && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { /* ok */ } }
  if (!ok && Store.has()) { var s = $('#sync'); if (s) s.outerHTML = syncHTML(); }
}
window.addEventListener('error', function (e) { console.error('OP% erro:', e.message); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
